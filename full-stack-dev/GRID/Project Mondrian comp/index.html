<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mondrian Project</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: beige;
    }

    .painting {
      width: 730px;
      height: 730px;
      background: #111;
      display: grid;
      gap: 8px;
      grid-template-columns: 100px 150px 180px 180px 55px 35px;
      grid-template-rows: 170px 155px 125px 95px 55px 40px;
      border-top: 4px solid white;
    }

    .w { background: #f2f2ee; }
    .g { background: #dcdcdc; }
    .r { background: #e53935; }
    .y { background: #f4e409; }
    .p { background: #4b3fbf; }
    .b { background: #111; }

    .top-left {
      grid-column: 1 / 3;
      grid-row: 1 / 2;
      display: grid;
      gap: 8px;
      grid-template-columns: 95px 1fr;
      grid-template-rows: 25px 1fr;
    }

    .tl-strip {
      grid-column: 1 / 3;
    }

    .r1 {
      grid-column: 1 / 2;
      grid-row: 2 / 3;
    }

    .w1 {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
    }

    .top-middle {
      grid-column: 3 / 5;
      grid-row: 1 / 2;
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 105px 1fr;
    }

    .w2 { grid-column: 1 / 2; grid-row: 1 / 2; }
    .g1 { grid-column: 2 / 3; grid-row: 1 / 2; }
    .y1 { grid-column: 1 / 2; grid-row: 2 / 3; }
    .p1 { grid-column: 2 / 3; grid-row: 2 / 3; }

    .y2 {
      grid-column: 5 / 6;
      grid-row: 1 / 2;
    }

    .left-strip {
      grid-column: 1 / 2;
      grid-row: 2 / 4;
    }

    .p2 {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
    }

    .y3 {
      grid-column: 3 / 4;
      grid-row: 2 / 3;
    }

    .g2 {
      grid-column: 4 / 5;
      grid-row: 2 / 3;
    }

    .right-red {
      grid-column: 5 / 6;
      grid-row: 2 / 5;
    }

    .right-white {
      grid-column: 6 / 7;
      grid-row: 2 / 5;
    }

    .b1 {
      grid-column: 1 / 3;
      grid-row: 3 / 4;
    }

    .w3 {
      grid-column: 3 / 4;
      grid-row: 3 / 4;
    }

    .b2 {
      grid-column: 4 / 5;
      grid-row: 3 / 5;
    }

    .bottom-left {
      grid-column: 1 / 3;
      grid-row: 4 / 7;
      display: grid;
      gap: 8px;
      grid-template-columns: 100px 1fr;
      grid-template-rows: 120px 55px 1fr;
    }

    .g3 { grid-column: 1 / 2; grid-row: 1 / 2; }
    .w4 { grid-column: 1 / 2; grid-row: 2 / 4; }
    .r2 { grid-column: 2 / 3; grid-row: 1 / 4; }

    .center-bottom {
      grid-column: 3 / 4;
      grid-row: 4 / 7;
      display: grid;
      gap: 8px;
      grid-template-rows: 90px 55px 1fr;
    }

    .w5 { grid-row: 1 / 2; }
    .p3 { grid-row: 2 / 3; }
    .b3 { grid-row: 3 / 4; }

    .bottom-right {
      grid-column: 4 / 6;
      grid-row: 5 / 7;
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 55px;
      grid-template-rows: 55px 1fr;
    }

    .y4 {
      grid-column: 1 / 2;
      grid-row: 1 / 2;
    }

    .g4 {
      grid-column: 1 / 2;
      grid-row: 2 / 3;
    }

    .w6 {
      grid-column: 2 / 3;
      grid-row: 1 / 3;
    }
  </style>
</head>

<body>
  <div class="painting">

    <div class="top-left">
      <div class="g tl-strip"></div>
      <div class="r r1"></div>
      <div class="w w1"></div>
    </div>

    <div class="top-middle">
      <div class="w w2"></div>
      <div class="g g1"></div>
      <div class="y y1"></div>
      <div class="p p1"></div>
    </div>

    <div class="y y2"></div>

    <div class="w left-strip"></div>
    <div class="p p2"></div>
    <div class="y y3"></div>
    <div class="g g2"></div>

    <div class="r right-red"></div>
    <div class="w right-white"></div>

    <div class="b b1"></div>
    <div class="w w3"></div>
    <div class="b b2"></div>

    <div class="bottom-left">
      <div class="g g3"></div>
      <div class="w w4"></div>
      <div class="r r2"></div>
    </div>

    <div class="center-bottom">
      <div class="w w5"></div>
      <div class="p p3"></div>
      <div class="b b3"></div>
    </div>

    <div class="bottom-right">
      <div class="y y4"></div>
      <div class="g g4"></div>
      <div class="w w6"></div>
    </div>

  </div>
</body>
</html>
