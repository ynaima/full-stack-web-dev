  <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project 2</title>
  <style>

    /* grid size : 730px × 730px
    gaP 8px between the cards
    COLORS:
    #E53935
    #F4E409
    #4B3FBF
    #111111
    #F2F2EE
    #E2E2E2 */

    
     body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: beige;
      min-height: 100vh;
    }
    .grid-container {
  display: grid;
  width: 730px;
  height: 730px;
  background: #1f1e1ee7;
  gap: 6px;
  border: 6px solid #000;
  padding-top: 6px;
  border-top: 4px solid #ffff;
  border-left: 9px solid #00000050;

  grid-template-columns: 40px 90px 130px 180px 180px 50px 24px;
  grid-template-rows: 20px 100px 60px 172px 100px 100px 50px 50px 30px;
}

.white{
        background-color: #ffffffee;
    }
    .grey{
        background-color: #e2e2e2d7;
    }
    .red{
        background-color: #d12f13;
    }
    .yellow{
        background-color: #F4E409;
    }
    .purple{
        background-color: #4B3FBF;
    }
    .black{
        background-color: #111111;
    }
    .b1{
      /* grid-row: span 3; */
      grid-area: 1/1/4/2;
    }
    .g1{
      /* grid-column: span 2; */
      grid-area: 1/2/1/4;
    }
    .r1{
      /* grid-row: span 2; */
      grid-area: 2/2/4/3;
    }
    .w1{
      grid-row: span 2;
    }
    .y1{
      grid-area: 3/4/4/5;
    }
    .w2{
      grid-area: 1/4/3/5;
    }
    .g2{
      grid-area:1/5/3/6;
    }
    .p1{
      grid-area: 3/5/4/6;
    }
    .y2{
      grid-area: 1/6/4/-1;
    }
    .w3{
      grid-row:span 2;
    }
    .p2{
      grid-area: 4/2/5/4;
    }
    .b2{
      grid-area:5/2/6/4;
    }
    .y3{
      grid-area:4/4/5/5;
    }
    .g3{
      grid-area: 4/5/5/6;
    }
    .r2{
      grid-area:4/6/7/7;
    }
    .w4{
      grid-area: 4/7/7/-1;
    }
    .b3{
      grid-area: 5/5/7/6;
    }
    .g4{
      grid-area: 6/1/8/3;
    }
    .r3{
      grid-area: 6/3/9/4;
    }
    .p3{
      grid-area:7/4/9/5;
    }
    .y4{
      grid-area: 7/5/9/6;
    }
    .w7{
      grid-area: 8/1/10/3;
    }
    .b4{
      grid-area: 9/3/10/5;
    }
    .g5{
      grid-area: 9/5/10/6;
    }
    .w8{
      grid-area: 7/6/10/-1;
    }

    
 





  </style>
</head>

<body>
